name: ZLI V2 desktop

# Pushes to main run these checks through the Release workflow's gate, so they are not triggered here too.
on:
  pull_request:
    paths:
      - "v2/**"
      - "package.json"
      - ".github/workflows/v2-desktop.yml"
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Other runs get a group of their own.
concurrency:
  group: v2-desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('v2/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm audit --audit-level high
      - run: pnpm run build
      # The installers build leaves the unpacked app (linux-unpacked, mac-<arch>/ZLI.app, win-unpacked)
      # next to them, so the checks and the Electron journey below run against that same build.
      - name: Build installers from the build above
        run: pnpm run desktop:pack:prebuilt
      - name: Inspect unpacked Linux application files
        if: runner.os == 'Linux'
        run: find apps/desktop/release/linux-unpacked -maxdepth 2 -type f -printf '%P (%m)\n' | sort
      - name: Inspect packaged macOS PTY helper
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)"; exit 1 ;;
          esac
          helper="apps/desktop/release/mac-${arch}/ZLI.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-${arch}/spawn-helper"
          ls -l "$helper"
          file "$helper"
          test -x "$helper"
      - name: Electron integration journey
        shell: bash
        env:
          ZLI_RUN_E2E: "1"
          ZLI_E2E_PACKAGED: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm run e2e
          else
            pnpm run e2e
          fi
      - name: Inspect remaining Linux runtime processes
        if: always() && runner.os == 'Linux'
        run: ps -eo pid,ppid,stat,args | grep -Ei '[e]lectron|[c]hromium|dev-server\.mjs|[z]li|[d]aemon-entry|[s]erver-entry' || true
      - name: Upload Electron diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zli-v2-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            v2/test-results/**
