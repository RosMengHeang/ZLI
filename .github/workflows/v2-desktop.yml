name: ZLI V2 desktop

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-desktop.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-desktop.yml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm audit --audit-level high
      - run: pnpm run build
      - run: pnpm run desktop:dir
      - name: Electron integration journey
        shell: bash
        env:
          ZLI_RUN_E2E: "1"
          ZLI_E2E_PACKAGED: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm run e2e
          else
            pnpm run e2e
          fi
      - run: pnpm run desktop:pack
      - name: Upload Electron diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zli-v2-${{ matrix.os }}-diagnostics
          if-no-files-found: ignore
          path: |
            v2/test-results/**
            v2/apps/desktop/release/**
            v2/apps/desktop/dist/**/*.map
