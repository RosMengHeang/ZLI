appId: dev.zli.desktop
productName: ZLI
artifactName: ZLI-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/**
  - renderer/**
win:
  target:
    - nsis
  requestedExecutionLevel: asInvoker
mac:
  target:
    - dmg
linux:
  executableName: zli
  target:
    - AppImage
