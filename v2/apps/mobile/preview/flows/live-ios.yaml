# The Live Activity outside the app on iOS: the compact and expanded Dynamic Island, then the lock
# screen look in Notification Center. Saves <name>-${THEME}.png in Maestro's output folder.
appId: dev.zli.remote
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
# ActivityKit only starts an activity while the app is on screen.
- waitForAnimationToEnd:
    timeout: 3000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: island-${THEME}

- longPressOn:
    point: "50%, 3%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: island-expanded-${THEME}
- pressKey: Home

- swipe:
    start: "25%, 1%"
    end: "25%, 75%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000
# iOS asks once whether to keep Live Activities on the lock screen, and the question covers the activity.
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: lock-${THEME}
- swipe:
    start: "50%, 98%"
    end: "50%, 20%"
    duration: 400
