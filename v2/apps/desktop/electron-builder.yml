appId: dev.zli.desktop
productName: ZLI
artifactName: ZLI-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: release
afterPack: ./scripts/after-pack.mjs
files:
  - dist/**
  - renderer/**
  # The window icon on Windows and Linux.
  - build/icon-square.png
# The release workflow creates a draft release for the tag first; each platform build uploads its
# installer and update files (latest*.yml, .blockmap) into it, and the workflow publishes it last.
publish:
  provider: github
  owner: RosMengHeang
  repo: ZLI
  releaseType: draft
# The icons in build/ are rendered at 1024px from branding/zli-icon.svg (macOS, inset to Apple's grid)
# and branding/zli-icon-square.svg (Windows and Linux); electron-builder makes the .icns and .ico.
win:
  icon: build/icon-square.png
  target:
    - nsis
  requestedExecutionLevel: asInvoker
mac:
  icon: build/icon.png
  # electron-updater reads the zip; people download the dmg.
  target:
    - dmg
    - zip
  # TODO(macOS signing): once the release workflow has the Developer ID and Apple ID secrets, turn these on
  # so builds are signed and notarized, and set ZLI_MAC_SIGNED there so the app installs its own updates.
  # hardenedRuntime: true
  # notarize: true
linux:
  executableName: zli
  icon: build/icon-square.png
  target:
    - AppImage
