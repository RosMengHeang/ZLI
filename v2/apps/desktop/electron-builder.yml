appId: dev.zli.desktop
productName: ZLI
artifactName: ZLI-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: release
afterPack: ./scripts/after-pack.mjs
files:
  - dist/**
  - renderer/**
  # The window icon on Windows and Linux.
  - build/icon-square.png
# The release workflow creates a draft release for the tag first; each platform build uploads its
# installer and update files (latest*.yml, .blockmap) into it, and the workflow publishes it last.
publish:
  provider: github
  owner: RosMengHeang
  repo: ZLI
  releaseType: draft
# The icons in build/ are rendered at 1024px from branding/zli-icon.svg (macOS, inset to Apple's grid)
# and branding/zli-icon-square.svg (Windows and Linux); electron-builder makes the .icns and .ico.
win:
  icon: build/icon-square.png
  target:
    - nsis
  requestedExecutionLevel: asInvoker
nsis:
  # Refreshes Windows' icon cache so an update's new icon shows on the taskbar.
  include: build/installer.nsh
mac:
  icon: build/icon.png
  # electron-updater reads the zip; people download the dmg.
  target:
    - dmg
    - zip
  # TODO(macOS signing): once the release workflow has the Developer ID and Apple ID secrets, turn these on
  # so builds are signed and notarized, and set ZLI_MAC_SIGNED there so the app installs its own updates.
  # hardenedRuntime: true
  # notarize: true
linux:
  executableName: zli
  icon: build/icon-square.png
  # Freedesktop menu category. Written into the desktop entry as Categories.
  category: Development
  # Electron uses desktopName from package.json as the Wayland app_id and X11 WM_CLASS. Docks link the
  # running window to the desktop entry, and its icon, only when the entry's name and StartupWMClass match it.
  # deb and rpm install that entry (Icon=zli, StartupWMClass=zli) plus a /usr/bin/zli link. The AppImage
  # keeps its own launcher.
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
# Runtime libraries Electron loads. Ubuntu 24.04 renamed some of them in the t64 transition; the
# alternative keeps one package installable there and on Debian and older Ubuntu, where the original
# name still exists. deb and rpm package names stay lowercase so apt and dnf can install `zli`.
deb:
  packageName: zli
  packageCategory: devel
  depends:
    - "libgtk-3-0 | libgtk-3-0t64"
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - "libatspi2.0-0 | libatspi2.0-0t64"
    - libuuid1
    - libsecret-1-0
    - "libasound2 | libasound2t64"
    - libgbm1
rpm:
  packageName: zli
  packageCategory: Development/Tools
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - "(libXtst or libXtst6)"
    - xdg-utils
    - at-spi2-core
    - "(libuuid or libuuid1)"
    - libsecret
    - alsa-lib
    - mesa-libgbm
