<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 10px; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; }
  .stage { background: #000; color: #e8e8ea; border-radius: var(--radius); padding: 16px; margin-bottom: 22px; }
  .hero { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px 4px; }
  .hc { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #8d8d95; }
  .demo { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; }
  .demo .well { height: 150px; display: grid; place-items: center; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font-size: 12px; padding: 4px 9px; border-radius: 6px; color: #8d8d95; background: #121212; transition: background .15s, color .15s; }
  .step.on { background: #181818; color: #f2f2f4; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .note { font-size: 12px; color: #8d8d95; margin-top: 10px; line-height: 1.45; min-height: 34px; }
  .moods { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px 2px; }
  .mc { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #8d8d95; text-align: center; }
  .label { font-size: 12px; color: #8d8d95; margin: 16px 0 8px; }
  .side { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .si { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .si em { font-style: normal; color: #8d8d95; font-size: 12px; }
  svg { display: block; overflow: visible; }

  /* ---------- Buddy motion ---------- */
  .buddy .root { transform-box: view-box; transform-origin: 16px 29px; }
  .buddy .body { transform-box: view-box; transform-origin: 16px 27px; }
  .buddy .eyes { transform-box: fill-box; transform-origin: center; }
  .buddy .fl, .buddy .fr { transform-box: fill-box; }

  /* Ready: calm and curious. Breathes, blinks, glances around now and then. */
  .s-idle .root { animation: breathe 3.4s ease-in-out infinite; }
  .s-idle .face { animation: glance 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .s-idle .eyes { animation: blink 5.2s infinite; animation-delay: var(--d, 0s); }
  .s-idle .puff { animation: puff 3s ease-out infinite; }
  /* Got a task: one hop to say "on it". */
  .s-ack .root { animation: ack 1.6s cubic-bezier(.3,1.5,.5,1) infinite; }
  /* Working: rocks left and right, steps in place, cursor eyes blink like a terminal. */
  .s-working .root { animation: lean 1.3s ease-in-out infinite; }
  .s-working .body { animation: bob .34s ease-in-out infinite; }
  .s-working .fl { animation: step .34s ease-in-out infinite alternate; }
  .s-working .fr { animation: step .34s ease-in-out infinite alternate-reverse; }
  .s-working .eyes { animation: cursor 1s steps(1) infinite; }
  /* Thinking: slow sway, eyes up, three dots. */
  .s-thinking .root { animation: sway 2.8s ease-in-out infinite; }
  .s-thinking .dot { animation: dot 1.2s ease-in-out infinite; }
  .s-thinking .dot:nth-child(2) { animation-delay: .2s; }
  .s-thinking .dot:nth-child(3) { animation-delay: .4s; }
  /* Needs you: double hop, then a pause, looking straight at you. */
  .s-waiting .root { animation: call 1.8s ease-in-out infinite; }
  /* Done: a little jump and spin, then settles. */
  .s-done .root { transform-origin: 16px 16px; animation: cheer 2.6s ease-in-out infinite; }
  /* Failed: a quick shake, then slumps. */
  .s-failed .root { animation: oops 3s ease-in-out infinite; }
  /* Stopped: asleep, slow breaths. */
  .s-stopped .root { animation: snooze 4.2s ease-in-out infinite; }
  .s-stopped .z { animation: zrise 2.8s ease-out infinite; }
  .s-stopped .z2 { animation-delay: 1.4s; }

  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.975); } }
  @keyframes glance { 0%,36% { transform: translateX(0); } 42%,56% { transform: translateX(1.2px); } 62%,80% { transform: translateX(-2.3px); } 86%,100% { transform: translateX(0); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes puff { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: .55; } 100% { transform: translate(1.6px,-4px); opacity: 0; } }
  @keyframes ack { 0% { transform: translateY(0) scale(1,1); } 12% { transform: translateY(0) scale(1.06,.92); } 30% { transform: translateY(-4.5px) scale(.94,1.07); } 48% { transform: translateY(0) scale(1.06,.94); } 60%,100% { transform: translateY(0) scale(1,1); } }
  @keyframes lean { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.1px); } }
  @keyframes step { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
  @keyframes cursor { 0% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes dot { 0%,100% { opacity: .15; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-.8px); } }
  @keyframes call { 0%,44%,100% { transform: translateY(0) scale(1,1); } 8% { transform: translateY(-3.4px) scale(.95,1.06); } 16% { transform: translateY(0) scale(1.05,.95); } 24% { transform: translateY(-2px) scale(.97,1.03); } 32% { transform: translateY(0) scale(1.03,.97); } }
  @keyframes cheer { 0% { transform: translateY(0) rotate(0); } 10% { transform: translateY(1px) scale(1.06,.92); } 22% { transform: translateY(-6px) rotate(0); } 40% { transform: translateY(-6px) rotate(360deg); } 52% { transform: translateY(0) rotate(360deg) scale(1.06,.94); } 60%,100% { transform: translateY(0) rotate(360deg) scale(1,1); } }
  @keyframes oops { 0% { transform: translateX(0); } 5% { transform: translateX(-1.8px); } 10% { transform: translateX(1.8px); } 15% { transform: translateX(-1.3px); } 20% { transform: translateX(1px); } 26%,100% { transform: translateX(0) scale(1.03,.93); } }
  @keyframes snooze { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.955); } }
  @keyframes zrise { 0% { transform: translate(0,2px); opacity: 0; } 25% { opacity: .85; } 100% { transform: translate(3px,-5px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .buddy * { animation: none !important; } }
</style></head>
<body><div id="root"></div>
<script>
const shade = (hex, amt) => { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };
function softPoly(n, r, rot, cx, cy, k = .36) {
  const P = [...Array(n)].map((_, i) => { const a = (rot - 90 + 360 / n * i) * Math.PI / 180; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
  const L = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  return P.map((c, i) => { const a = L(c, P[(i + n - 1) % n], k), b = L(c, P[(i + 1) % n], k); return `${i ? "L" : "M"}${a.join(" ")} Q${c.join(" ")} ${b.join(" ")}`; }).join(" ") + "Z";
}
const W = "#ffffff";
/* Each buddy: body, eye line, a highlight, and one small thing that is only theirs. */
const BUDDIES = [
  { name: "Gumdrop", c: "#ff8a3d", ey: 15.6, hl: [11, 10, 1.5, 2.8, 30],
    body: `<path d="M5.5 23 C5.5 12 10 4.5 16 4.5 C22 4.5 26.5 12 26.5 23 Q26.5 25.6 24 25.6 H8 Q5.5 25.6 5.5 23Z"/>`,
    front: () => `<path d="M16 5 C16 3.4 16.4 2.4 17.2 1.6" stroke="#5a8f3c" stroke-width="1.1" stroke-linecap="round" fill="none"/><path d="M17 2.4 C18.4 .4 21.6 .2 22.6 1.4 C21.4 3.4 18.6 3.6 17 2.4Z" fill="#7cc657"/>` },
  { name: "Capsule", c: "#a6d44f", cg: 4.9, ey: 12.8, hl: [12, 7.6, 1.2, 2.6, 15],
    body: `<rect x="8.6" y="2.6" width="14.8" height="23.4" rx="7.4"/>`,
    front: c => `<path d="M15.4 3 C14.2 .6 16.8 -.6 18 1 C18.8 2.2 17.4 3.2 16.6 2.4" stroke="${c}" stroke-width="1.5" stroke-linecap="round" fill="none"/>` },
  { name: "Plus", c: "#ff7aa8", ey: 14.8, hl: [13.4, 6.8, .9, 2, 15],
    body: `<rect x="10.6" y="3" width="10.8" height="23" rx="4.4"/><rect x="3.6" y="9.4" width="24.8" height="10.6" rx="4.4"/>`,
    front: () => `<path d="M16 3.6 L12.4 1.2 Q11.6 .9 11.6 1.8 V5.4 Q11.6 6.3 12.4 6 Z M16 3.6 L19.6 1.2 Q20.4 .9 20.4 1.8 V5.4 Q20.4 6.3 19.6 6 Z" fill="${W}"/><circle cx="16" cy="3.6" r="1.2" fill="#ffd2e1"/>` },
  { name: "Cloud", c: "#4aa8ff", ey: 17.4, hl: [11.4, 11.4, 1.3, 2.4, 40],
    body: `<path d="M8 25.8 C4.4 25.8 2.6 23.2 3 20.4 C3.4 17.6 5.6 16.2 7.8 16.4 C7.8 10.6 11.4 7 16 7 C20.6 7 23.6 10.2 24.2 14.2 C27.2 14.2 29.4 16.8 29 20 C28.6 23.4 26.4 25.8 23.6 25.8Z"/>`,
    front: () => `<path d="M27.4 6.4 C27.4 6.4 25.8 8.6 25.8 9.6 a1.6 1.6 0 0 0 3.2 0 C29 8.6 27.4 6.4 27.4 6.4Z" fill="#9fd0ff"/>` },
  { name: "Mushroom", c: "#6f6cf6", cg: 3.9, ey: 20.6, hl: null,
    body: `<path d="M3.2 14.4 C3.2 7.8 9 3.6 16 3.6 C23 3.6 28.8 7.8 28.8 14.4 Q28.8 16.6 26.6 16.6 H5.4 Q3.2 16.6 3.2 14.4Z"/><rect x="9.6" y="14" width="12.8" height="12" rx="4"/>`,
    front: () => `<path d="M9.6 16.6 H22.4 V17.6 Q16 18.8 9.6 17.6Z" fill="#000" opacity=".14"/><circle cx="8.4" cy="10.6" r="1.7" fill="${W}" opacity=".92"/><circle cx="16.2" cy="6.8" r="2" fill="${W}" opacity=".92"/><circle cx="23.6" cy="11" r="1.4" fill="${W}" opacity=".92"/><circle cx="20" cy="12.4" r=".8" fill="${W}" opacity=".92"/>` },
  { name: "Peanut", c: "#c9825b", ey: 15.8, hl: [7.4, 13, 1.2, 2.4, 30],
    body: `<circle cx="10.6" cy="16.6" r="8"/><circle cx="21.4" cy="15.4" r="8.4"/><rect x="10" y="13" width="12" height="12" rx="3"/>`,
    front: c => `<path d="M15.8 8.2 Q15.2 10 16 11.2" stroke="${shade(c, -.28)}" stroke-width="1" stroke-linecap="round" fill="none"/><path d="M7.4 20 l.9 .5 M24 21 l.9 -.4 M21.6 9.6 l.7 .6" stroke="${shade(c, -.28)}" stroke-width=".9" stroke-linecap="round"/>` },
  { name: "Jelly", c: "#2fbf8f", ey: 14.6, hl: [9.8, 8.4, 1.5, 3, 35], nofeet: true,
    body: `<path d="M4.6 15.4 C4.6 8.4 9.6 4 16 4 C22.4 4 27.4 8.4 27.4 15.4 V24 Q25.5 26.6 23.7 24 Q21.8 21.6 19.9 24 Q18 26.6 16 24 Q14 21.6 12.1 24 Q10.2 26.6 8.3 24 Q6.5 21.6 4.6 24Z"/>`,
    front: () => `<circle cx="27" cy="3.4" r="1.5" fill="none" stroke="#7fe0bd" stroke-width=".8"/><circle cx="29.2" cy="6.4" r=".8" fill="none" stroke="#7fe0bd" stroke-width=".7"/>` },
  { name: "Wedge", c: "#f2cf5b", cg: 5.4, ey: 18.4, hl: null,
    body: `<path d="${softPoly(3, 14, 0, 16, 17.2, .3)}"/>`,
    front: c => `<circle cx="10.6" cy="22.2" r="1.3" fill="${shade(c, -.2)}"/><circle cx="22.4" cy="22.6" r="1.5" fill="${shade(c, -.2)}"/><circle cx="16.4" cy="10.4" r="1.1" fill="${shade(c, -.2)}"/><circle cx="17.6" cy="23.2" r=".7" fill="${shade(c, -.2)}"/>` },
  { name: "Squircle", c: "#ece8df", ey: 15, hl: [8.8, 9.6, 1.2, 2.6, 25], glasses: true,
    body: `<rect x="5" y="5" width="22" height="20.6" rx="8.4" transform="rotate(-9 16 15.3)"/>`,
    front: () => `<path d="M21.4 3.6 L25.6 6.8" stroke="#f2cf5b" stroke-width="2.2" stroke-linecap="round"/><path d="M25.6 6.8 L26.6 7.6" stroke="#ef5a47" stroke-width="2.2" stroke-linecap="round"/>` },
  { name: "Bulb", c: "#c56ff0", ey: 17, hl: [10.6, 11.4, 1.3, 2.6, 35],
    body: `<path d="M16 2.6 C17.6 5 19 5.6 21 7.2 C25 10.2 27 13.8 27 17.6 C27 22.6 22.4 25.8 16 25.8 C9.6 25.8 5 22.6 5 17.6 C5 13.8 7 10.2 11 7.2 C13 5.6 14.4 5 16 2.6Z"/>`,
    front: c => `<path d="M16 3 C16.2 1.2 17.8 .4 18.8 1.4" stroke="${c}" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M12.2 9.6 Q11.4 12.6 12 15 M19.8 9.6 Q20.6 12.6 20 15" stroke="${shade(c, -.2)}" stroke-width=".8" stroke-linecap="round" fill="none" opacity=".6"/>` },
  { name: "House", c: "#ef5a47", ey: 16.6, hl: [10.8, 9.8, 1.1, 2.3, 40],
    back: c => `<rect x="20.6" y="2.4" width="3.4" height="6.4" rx=".9" fill="${shade(c, -.25)}"/>`,
    body: `<path d="${softPoly(5, 13.4, 0, 16, 15.6, .3)}"/>`,
    front: () => `<circle class="puff" cx="22.3" cy="0.4" r="1.2" fill="#d6d6da"/>` },
  { name: "Bean", c: "#8a93a3", ey: 15.6, hl: [7.4, 16, 1, 2.3, 10],
    body: `<path d="M7 9 C10.6 4.4 20.6 3.6 25 8.6 C28.6 12.8 27.8 20 24.6 23.4 C20.8 27.4 11 27.4 7.2 23.6 C3.6 20 3.6 13.4 7 9Z"/>`,
    front: () => `<path d="M6.4 10.6 C7.4 5.6 12 3.4 16.4 3.6 C21 3.8 25.4 5.8 26.6 10.2 Q16.4 7.6 6.4 10.6Z" fill="#ef5a47"/><path d="M6.4 10.6 Q16.4 7.6 26.6 10.2 L26.8 11.6 Q16.4 9 6.2 12Z" fill="#c8402f"/><circle cx="16.8" cy="2.8" r="1.9" fill="${W}"/>` },
];
const inkFor = c => { const n = parseInt(c.slice(1), 16); return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) > 90 ? "#141417" : "#f4f4f6"; };

/* Eyes: two cursor blocks, glancing right toward the chat. */
function face(mood, ey, ink, b, small) {
  const look = mood === "waiting" || mood === "stopped" ? 0 : 1.1, gap = 3.3, up = mood === "thinking" ? -1.4 : 0;
  const line = `stroke="${ink}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  let eyes = "";
  for (const s of [-1, 1]) {
    const x = 16 + look + s * gap + (mood === "thinking" ? .6 : 0), y = ey + up;
    eyes += {
      working:  `<rect x="${x - 1.3}" y="${y + .9}" width="2.6" height="1.3" rx=".4" fill="${ink}"/>`,
      thinking: `<rect x="${x - 1}" y="${y - 1.5}" width="2" height="2.9" rx=".55" fill="${ink}"/>`,
      waiting:  `<rect x="${x - 1.25}" y="${y - 2.9}" width="2.5" height="5.4" rx=".7" fill="${ink}"/><rect x="${x - .4}" y="${y - 2.2}" width=".8" height="1.2" rx=".3" fill="#fff" opacity=".9"/>`,
      done:     `<path d="M${x - 1.4} ${y + .6} L${x} ${y - 1} L${x + 1.4} ${y + .6}" ${line}/>`,
      failed:   `<path d="M${x - 1.1} ${y - 1.1} L${x + 1.1} ${y + 1.1} M${x + 1.1} ${y - 1.1} L${x - 1.1} ${y + 1.1}" ${line} stroke-width="1.4"/>`,
      stopped:  `<path d="M${x - 1.3} ${y + .2} Q${x} ${y + 1.4} ${x + 1.3} ${y + .2}" ${line} stroke-width="1.3"/>`,
    }[mood] ?? `<rect x="${x - 1.1}" y="${y - 1.9}" width="2.2" height="3.8" rx=".6" fill="${ink}"/><rect x="${x - .3}" y="${y - 1.4}" width=".7" height="1" rx=".3" fill="#fff" opacity=".85"/>`;
  }
  const mx = 16 + look, my = ey + 3.6;
  const mouth = {
    done: `<path d="M${mx - 1.5} ${my - .4} Q${mx} ${my + 1.6} ${mx + 1.5} ${my - .4}Z" fill="${ink}"/>`,
    waiting: `<ellipse cx="${mx}" cy="${my + .2}" rx=".75" ry=".95" fill="${ink}"/>`,
    failed: `<path d="M${mx - 1.3} ${my + .6} Q${mx} ${my - .5} ${mx + 1.3} ${my + .6}" ${line} stroke-width="1.1"/>`,
    thinking: `<path d="M${mx - .2} ${my - .2} H${mx + 1.3}" ${line} stroke-width="1.1"/>`,
  }[mood] ?? "";
  const cheeks = small ? "" : `<ellipse cx="${16 + look - (b.cg ?? 6.2)}" cy="${ey + 2.4}" rx="1.5" ry=".85" fill="#ff5f87" opacity=".38"/><ellipse cx="${16 + look + (b.cg ?? 6.2)}" cy="${ey + 2.4}" rx="1.5" ry=".85" fill="#ff5f87" opacity=".38"/>`;
  const glasses = b.glasses ? `<circle cx="${16 + look - gap}" cy="${ey}" r="2.8" fill="none" stroke="${ink}" stroke-width=".8"/><circle cx="${16 + look + gap}" cy="${ey}" r="2.8" fill="none" stroke="${ink}" stroke-width=".8"/><path d="M${16 + look - .5} ${ey - .3} H${16 + look + .5}" stroke="${ink}" stroke-width=".8"/>` : "";
  return `<g class="face">${cheeks}<g class="eyes">${eyes}</g>${mouth}${glasses}</g>`;
}

function buddy(b, mood = "idle", size = 56, delay = 0) {
  const ink = inkFor(b.c), small = size < 30;
  const feet = b.nofeet ? "" : `<rect class="fl" x="10.6" y="24.6" width="3.6" height="4.4" rx="1.6" fill="${shade(b.c, -.12)}"/><rect class="fr" x="17.8" y="24.6" width="3.6" height="4.4" rx="1.6" fill="${shade(b.c, -.12)}"/>`;
  const hl = b.hl && !small ? `<ellipse cx="${b.hl[0]}" cy="${b.hl[1]}" rx="${b.hl[2]}" ry="${b.hl[3]}" transform="rotate(${b.hl[4]} ${b.hl[0]} ${b.hl[1]})" fill="#fff" opacity=".32"/>` : "";
  const extra = mood === "thinking" ? `<g fill="${ink === "#141417" ? "#e8e8ea" : "#e8e8ea"}"><circle class="dot" cx="24.6" cy="3.4" r=".9"/><circle class="dot" cx="27.2" cy="2" r="1.1"/><circle class="dot" cx="30" cy=".4" r="1.3"/></g>`
    : mood === "stopped" ? `<text class="z" x="24.4" y="6" font-size="5" font-weight="700" fill="#c9c9d1" font-family="var(--font-sans)">z</text><text class="z z2" x="26.4" y="3.6" font-size="3.6" font-weight="700" fill="#c9c9d1" font-family="var(--font-sans)">z</text>` : "";
  const grey = mood === "failed" ? ` style="filter:grayscale(1);opacity:.55"` : mood === "stopped" ? ` style="opacity:.75"` : "";
  return `<svg class="buddy s-${mood}" style="--d:${delay}s" viewBox="0 0 32 32" width="${size}" height="${size}"><g${grey}><g class="root">${feet}<g class="body">${b.back ? b.back(b.c) : ""}<g fill="${b.c}">${b.body}</g>${hl}${b.front ? b.front(b.c) : ""}${face(mood, b.ey, ink, b, small)}</g></g>${extra}</g></svg>`;
}

const B = Object.fromEntries(BUDDIES.map(b => [b.name, b]));
const MOODS = [["idle", "Ready"], ["ack", "Got a task"], ["working", "Working"], ["thinking", "Thinking"], ["waiting", "Needs you"], ["done", "Done"], ["failed", "Failed"], ["stopped", "Stopped"]];
const moodFace = m => m === "ack" ? "idle" : m;
const buddyM = (b, m, s, d) => buddy(b, moodFace(m), s, d).replace(`s-${moodFace(m)}`, `s-${m}`);

const LIFE = [["idle", 3400, "Calm and a little curious: breathes, blinks, glances around."], ["ack", 1000, "A task arrives: one hop to say it's on it."], ["working", 3600, "Rocks side to side and steps in place. The eyes blink like a terminal cursor."], ["thinking", 3000, "Slows down, looks up, three dots."], ["working", 2000, "Back to work."], ["waiting", 3600, "Turns to face you and hops twice, then waits."], ["done", 2600, "A jump and a spin, then it settles."]];

document.getElementById("root").innerHTML = `
<h2>Buddies</h2>
<p>Twelve buddies, one family: same feet, same cursor eyes, same pink cheeks. Each one gets one small thing of its own, like a leaf, a bow, a beanie, glasses with a pencil, or a chimney that puffs.</p>
<div class="stage"><div class="hero">${BUDDIES.map((b, i) => `<div class="hc">${buddy(b, "idle", 64, -(i * 0.9))}${b.name}</div>`).join("")}</div></div>

<h2>A day in the life</h2>
<p>The buddy itself shows what the agent is doing, so no separate status icon is needed.</p>
<div class="stage"><div class="demo"><div class="well" id="hero"></div><div>
  <div class="steps" id="steps">${["Ready", "Got a task", "Working", "Thinking", "Needs you", "Done"].map(s => `<span class="step">${s}</span>`).join("")}</div>
  <div class="note" id="note"></div></div></div></div>

<h2>Every mood</h2>
<div class="stage"><div class="moods">${MOODS.map(([m, l], i) => `<div class="mc">${buddyM(B.Gumdrop, m, 56, 0)}${l}</div>`).join("")}</div>
<div class="label">In the sidebar, 22 px. Cheeks and shine drop out at this size.</div>
<div class="side">${[["Bean", "working", "working"], ["Cloud", "thinking", "thinking"], ["Plus", "waiting", "needs you"], ["Mushroom", "idle", "ready"]].map(([n, m, l]) => `<div class="si">${buddy(B[n], m, 22)}<span>${n} <em>· ${l}</em></span></div>`).join("")}</div></div>`;

const stepIdx = { idle: 0, ack: 1, working: 2, thinking: 3, waiting: 4, done: 5 };
let k = 0;
function play() {
  const [m, ms, note] = LIFE[k % LIFE.length];
  document.getElementById("hero").innerHTML = buddyM(B.Bean, m, 132, 0);
  document.querySelectorAll(".step").forEach((el, i) => el.classList.toggle("on", i === stepIdx[m]));
  document.getElementById("note").textContent = note;
  k++; setTimeout(play, ms);
}
play();
</script></body></html>
