<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Slow script</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Slow script</h1>
    <p id="slow-status">Waiting for assets/slow.js</p>
    <p>Serve with <code>node serve.mjs</code> so <code>/assets/slow.js</code> is delayed. A plain static server returns the file immediately.</p>
  </main>
  <script src="assets/slow.js"></script>
</body>
</html>
