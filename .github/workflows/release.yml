name: Release

# Every merge to main ships a patch release. Run this workflow by hand for a minor or major one.
# The v* tag is the only record of the version: package.json files keep 0.0.0 on main and get the
# release version written into them inside the gate's build jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Two quick merges must not compute the same version. A newer push waits for the running release;
# GitHub keeps only the newest waiting run, which builds main with the changes of the run it replaced.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only works the version out. Nothing is tagged until the gate passes.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      sha: ${{ steps.next.outputs.sha }}
      skip: ${{ steps.next.outputs.skip }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - name: Work out the next version
        id: next
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.mjs next
      - name: Explain the skip
        if: steps.next.outputs.skip == 'true'
        run: echo "::notice::No release for this push (${{ steps.next.outputs.reason }})."

  # The pull request checks (audit, verify, and the Electron journey) run again on the release commit, so a
  # merge with a known high or critical advisory or a failing check never ships. When this push releases, the
  # same jobs build the installers with the release version and the journey runs against them, so the files
  # that pass are the files that ship. A push that skips the release still gets the checks.
  gate:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/v2-desktop.yml
    with:
      release_version: ${{ needs.version.outputs.skip != 'true' && needs.version.outputs.version || '' }}

  # The only job with write access. It runs no project code: it checks the gate's files, tags the commit, and
  # publishes the release with them.
  publish:
    needs: [version, gate]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Check the installers and update files are all there
        run: |
          files="$(ls installers)"
          echo "$files"
          missing=0
          for pattern in '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' '\.exe$' '\.exe\.blockmap$' \
            '\.dmg$' '-mac-.*\.zip$' '\.AppImage$' '\.deb$' '\.rpm$'; do
            if ! grep -Eq -- "$pattern" <<< "$files"; then
              echo "::error::No release file matches $pattern"
              missing=1
            fi
          done
          exit "$missing"
      - name: Tag the release commit
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
      - name: Create the draft release with notes and the installers
        run: |
          args=(-f "tag_name=$TAG" -f "target_commitish=$SHA")
          if [ -n "$PREVIOUS_TAG" ]; then args+=(-f "previous_tag_name=$PREVIOUS_TAG"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ZLI $TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
