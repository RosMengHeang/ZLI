# Walks every screen of the demo build (EXPO_PUBLIC_ZLI_DEMO=1) on iOS and Android and saves
# <screen>-${THEME}.png in Maestro's output folder. Each screen starts from a fresh launch, so one bad step does not
# leave the next screen somewhere unexpected.
appId: dev.zli.remote
---
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
# iOS asks for notifications once the desktop is paired, which can cover the home screen.
- extendedWaitUntil:
    visible: "Needs you|Allow"
    timeout: 90000
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: home-${THEME}

- tapOn: "Clean the build output.*rm -rf build.*"
- extendedWaitUntil:
    visible: "Approve"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: approval-${THEME}

- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
- tapOn: "Fix the login form.*"
- extendedWaitUntil:
    visible: ".*Running the tests now.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: agent-${THEME}

- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
- tapOn: "New agent"
- extendedWaitUntil:
    visible: "Where it works"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: start-${THEME}

- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
- tapOn: "Shell, shell.*"
# iOS reads the output as one element by its label, so its text is not visible to Maestro there.
- extendedWaitUntil:
    visible: "Terminal output|.*19 passed.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: terminal-${THEME}

- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Needs you"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Paired desktop"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: settings-${THEME}

# Forgetting the demo desktop only lasts until the next launch.
- tapOn: "Forget Studio"
- tapOn: "Forget"
- extendedWaitUntil:
    visible: "Scan pairing code"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: pair-${THEME}
