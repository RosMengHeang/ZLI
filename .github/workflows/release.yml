name: Release

# Every merge to main ships a patch release. Run this workflow by hand for a minor or major one.
# The v* tag is the only record of the version: package.json files keep 0.0.0 on main and get the
# release version written into them inside the gate's build jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Two quick merges must not compute the same version. A newer push waits for the running release;
# GitHub keeps only the newest waiting run, which builds main with the changes of the run it replaced.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Only works the version out. Nothing is tagged until the gate passes.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      sha: ${{ steps.next.outputs.sha }}
      skip: ${{ steps.next.outputs.skip }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - name: Work out the next version
        id: next
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.mjs next
      - name: Explain the skip
        if: steps.next.outputs.skip == 'true'
        run: echo "::notice::No release for this push (${{ steps.next.outputs.reason }})."

  # The pull request checks (audit, verify, and the Electron journey) run again on the release commit, so a
  # merge with a known high or critical advisory or a failing check never ships. When this push releases, the
  # same jobs build the installers with the release version and the journey runs against them, so the files
  # that pass are the files that ship. A push that skips the release still gets the checks.
  gate:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/v2-desktop.yml
    with:
      release_version: ${{ needs.version.outputs.skip != 'true' && needs.version.outputs.version || '' }}

  # The only job with write access. It runs no project code: it checks the gate's files, tags the commit, and
  # publishes the release with them. Every step can run again for a tag that already exists, so re-running the
  # failed jobs of a release run finishes a publish that broke halfway.
  publish:
    needs: [version, gate]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Check the installers and update files are all there
        run: |
          files="$(ls installers)"
          echo "$files"
          missing=0
          for pattern in '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' '\.exe$' '\.exe\.blockmap$' \
            '\.dmg$' '-mac-.*\.zip$' '\.AppImage$' '\.deb$' '\.rpm$'; do
            if ! grep -Eq -- "$pattern" <<< "$files"; then
              echo "::error::No release file matches $pattern"
              missing=1
            fi
          done
          exit "$missing"
      # GitHub's API sometimes answers 500 for a moment (v0.1.16 was lost to one), so each call gets four tries.
      # Its warnings go to stderr: callers capture stdout as the command's result.
      - name: Write the retry helper
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'EOF'
          retry() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              if [ "$attempt" -lt 4 ]; then
                echo "::warning::Attempt $attempt of $* failed, trying again in $((attempt * 15))s" >&2
                sleep "$((attempt * 15))"
              fi
            done
            return 1
          }
          EOF
      - name: Tag the release commit
        run: |
          source "$RUNNER_TEMP/retry.sh"
          tagged="$(retry gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq 'map(select(.ref == "refs/tags/" + env.TAG))[0].object.sha // ""')"
          if [ -z "$tagged" ]; then
            retry gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          elif [ "$tagged" != "$SHA" ]; then
            echo "::error::$TAG already points at $tagged, not $SHA"
            exit 1
          else
            echo "$TAG already points at $SHA"
          fi
      - name: Create or reuse the draft release, then publish it
        run: |
          source "$RUNNER_TEMP/retry.sh"
          # Prints missing, draft, or published. A failed lookup fails the call instead of reading as missing,
          # so a flaky request never leads to a second draft for the same tag.
          release_state() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
              'map(select(.tag_name == env.TAG))[0] | if . == null then "missing" elif .draft then "draft" else "published" end'
          }
          state="$(retry release_state)"
          if [ "$state" = published ]; then
            echo "$TAG is already published"
            exit 0
          fi
          if [ "$state" = missing ]; then
            args=(-f "tag_name=$TAG" -f "target_commitish=$SHA")
            if [ -n "$PREVIOUS_TAG" ]; then args+=(-f "previous_tag_name=$PREVIOUS_TAG"); fi
            retry gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
            # A create that failed after GitHub saved the draft must not make a second draft on the next try.
            create_draft() {
              [ "$(release_state)" = draft ] || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                --title "ZLI $TAG" --notes-file "$RUNNER_TEMP/notes.md"
            }
            retry create_draft
          fi
          # Uploading separately from the create lets a retry replace a file that was only half uploaded.
          retry gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Open an issue about the failed release
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release $TAG failed"
          body="Publishing $TAG ($SHA) failed: $RUN_URL. Re-run the failed jobs of that run to finish the release."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq 'map(select(.title == "Release " + env.TAG + " failed"))[0].number // ""')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
